name: Build QDL

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          python3 - <<'EOF'
          import json, os
          files = json.load(open("qdl-bundle.json"))
          for path, content in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w") as f:
                  f.write(content)
              print("unpacked", path)
          EOF

      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 BUILD_NUMBER=${{ github.run_number }} bash build.sh --no-install

      - name: Zip the app
        run: ditto -c -k --keepParent QDL.app QDL-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QDL-app
          path: QDL-app.zip

      - name: Publish release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" QDL-app.zip --title "QDL build ${{ github.run_number }}" --notes "Automatic build from ${{ github.sha }}" --latest
