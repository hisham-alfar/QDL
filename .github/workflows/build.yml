name: Build QDL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          python3 - <<'EOF'
          import json, os
          files = json.load(open("qdl-bundle.json"))
          for path, content in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w") as f:
                  f.write(content)
              print("unpacked", path)
          EOF

      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh --no-install

      - name: Zip the app
        run: ditto -c -k --keepParent QDL.app QDL-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QDL-app
          path: QDL-app.zip
